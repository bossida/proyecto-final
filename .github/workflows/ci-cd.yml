name: CI/CD pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: tp_final

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci
        working-directory: ./app

      - name: Lint
        run: npm run lint
        working-directory: ./app
        continue-on-error: false

      - name: Run tests
        run: npm test -- --ci --reporter=jest-junit
        working-directory: ./app 

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage

#     - name: SonarQube Scan
#       uses: sonarsource/sonarcloud-github-action@v1
#       with:
#         args: >
#           -Dsonar.login=${{ secrets.SONAR_TOKEN }}
#     - name: Snyk Scan
#       uses: snyk/actions/node@v2
#       with:
#         args: test --severity-threshold=high
#       env:
#         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  build_and_deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #ECR_PUBLIC_ALIAS: ${{ secrets.ECR_PUBLIC_ALIAS }}
      - name: Build and push image to ECR (or DockerHub)
        run: |
          REGISTRY="${{ steps.ecr_login.outputs.registry }}"
          IMAGE_URI=${REGISTRY}/w2p1k7q0/mundose:$GITHUB_SHA
          echo "Building image: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to server via SSH (docker-compose pull & up)        
        env:
          IMAGE_URI: ${{ steps.ecr_login.outputs.registry }}/w2p1k7q0/mundose:${{ github.sha }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE_URI="${{ env.IMAGE_URI }}"
            echo "Pulling image:" $IMAGE_URI
            mkdir -p ~/deploy
            cd ~/deploy
            cat > docker-compose.yml <<EOF
            version: "3.8"
            services:
              app:
                image: $IMAGE_URI
                restart: always
                ports:
                  - "3000:3000"
            EOF
            docker compose pull || true
            docker compose up -d --remove-orphans
